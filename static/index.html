<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iris: паспорт модели</title><style>body{font:16px system-ui;max-width:820px;margin:2rem auto;padding:0 1rem;color:#172033}form{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem}label{display:grid;gap:.25rem}input,button{font:inherit;padding:.55rem}button{cursor:pointer;background:#1769aa;color:white;border:0;border-radius:.3rem}.card{padding:1rem;background:#f2f6fa;margin:1rem 0}.error{color:#b42318}code{overflow-wrap:anywhere}</style></head>
<body><h1>Iris: паспорт модели и request ID</h1><p id="health">Проверяем состояние сервиса…</p><section class="card"><h2>Паспорт модели</h2><dl id="passport"></dl></section><form id="form"><label>Длина чашелистика<input name="sepal_length" type="number" step="any" value="5.1" required></label><label>Ширина чашелистика<input name="sepal_width" type="number" step="any" value="3.5" required></label><label>Длина лепестка<input name="petal_length" type="number" step="any" value="1.4" required></label><label>Ширина лепестка<input name="petal_width" type="number" step="any" value="0.2" required></label><button>Получить прогноз</button></form><p id="error" class="error" role="alert"></p><section id="result" class="card" hidden></section>
<script>
const el = id => document.getElementById(id);

async function request(path, options) {
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) {
    const detail = Array.isArray(data.detail)
      ? data.detail.map(error => `${error.loc.join('.')}: ${error.msg}`).join('; ')
      : data.detail;
    const requestId = response.headers.get('X-Request-ID');
    throw new Error((detail || 'Ошибка запроса') + (requestId ? ` (request ID: ${requestId})` : ''));
  }
  return data;
}

function textElement(tag, text) {
  const node = document.createElement(tag);
  node.textContent = text;
  return node;
}

el('form').addEventListener('submit', async event => {
  event.preventDefault();
  el('error').textContent = '';
  el('result').hidden = true;
  const button = event.currentTarget.querySelector('button');
  button.disabled = true;
  try {
    const values = Object.fromEntries(new FormData(event.currentTarget));
    for (const key in values) values[key] = Number(values[key]);
    const requestId = crypto.randomUUID();
    const result = await request('/predict', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Request-ID': requestId},
      body: JSON.stringify(values),
    });
    const identifier = textElement('p', 'Идентификатор запроса: ');
    identifier.append(textElement('code', result.request_id));
    el('result').replaceChildren(
      textElement('h2', `Прогноз: ${result.class_name} (класс ${result.class_id})`), identifier,
    );
    el('result').hidden = false;
  } catch (error) {
    el('error').textContent = error.message;
  } finally {
    button.disabled = false;
  }
});

(async () => {
  try {
    const [info, health] = await Promise.all([request('/model-info'), request('/health')]);
    el('health').textContent = health.status === 'ok' && health.model_loaded === true
      ? 'Сервис и модель готовы.' : 'Модель не готова.';
    const entries = [
      ['Тип', info.model_type], ['Классы', info.classes.join(', ')],
      ['Число признаков', info.feature_count], ['Модель загружена', info.model_loaded ? 'Да' : 'Нет'],
    ];
    el('passport').replaceChildren(...entries.flatMap(([name, value]) => [
      textElement('dt', name), textElement('dd', value),
    ]));
  } catch (error) {
    el('health').textContent = 'Не удалось получить сведения: ' + error.message;
  }
})();
</script></body></html>
