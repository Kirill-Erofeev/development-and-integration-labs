name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            client/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt -r client/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app src scripts tests client
      - name: Run all tests
        run: python -m pytest -q

  build-image:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build API image
        run: docker build --file Dockerfile --tag "ml-api:test-${GITHUB_SHA}" .
      - name: Build client image
        run: docker build --file client/Dockerfile --tag "ml-client:test-${GITHUB_SHA}" client
