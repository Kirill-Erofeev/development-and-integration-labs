<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swagger UI — API классификации ирисов</title>
  <link rel="stylesheet" href="./swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
    .page-note { max-width: 1460px; margin: 0 auto; padding: 20px; font: 16px/1.5 system-ui, sans-serif; color: #3b4151; }
    .page-note a { color: #005ea8; }
    .page-note p { margin: 8px 0 0; }
  </style>
</head>
<body>
  <header class="page-note">
    <a href="../">Главная</a> · <a href="./openapi.json">Скачать OpenAPI JSON</a>
    <p>Это статический контракт API. Выполнение запросов отключено: GitHub Pages не запускает модель или FastAPI.</p>
    <p>Для проверки работающего API откройте его локальную страницу <code>/docs</code> после запуска по инструкции в README.</p>
  </header>
  <div id="swagger-ui"></div>
  <noscript>Для просмотра Swagger UI включите JavaScript. Схема доступна по ссылке «Скачать OpenAPI JSON».</noscript>
  <script src="./swagger-ui-bundle.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: "./openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        validatorUrl: null,
        supportedSubmitMethods: [],
        tryItOutEnabled: false,
        persistAuthorization: false
      });
    };
  </script>
</body>
</html>
